<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ProFrame 3D Configurator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F3F2EC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      touch-action: none;
    }
    #loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #013E37;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.4px;
      pointer-events: none;
      transition: opacity 0.25s ease;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(1, 62, 55, 0.15);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="loading-indicator">Loading 3D engine…</div>

  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="parametric_engine.js"></script>

  <script>
    window.addEventListener('load', function () {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () { loader.style.display = 'none'; }, 250);
      }
    });
  </script>
</body>
</html>
