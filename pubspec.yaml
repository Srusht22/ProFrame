name: proframe
description: A modern parametric 3D product configurator for factory workers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.2
  path: ^1.9.0
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/web_3d/
    - assets/web_3d/three.min.js
    - assets/web_3d/OrbitControls.js
    - assets/web_3d/parametric_engine.js
    - assets/web_3d/index.html
