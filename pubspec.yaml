name: proframe
description: >
  ProFrame — draw a door or window by hand and get a real, dimensioned
  3D model of it.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^3.4.3

  # Routing
  go_router: ^18.0.1

  # Offline-first local persistence for saved designs and drafts
  shared_preferences: ^2.2.3

  # Real WebGL rendering bridge — Chromium / WKWebView + three.js
  flutter_inappwebview: ^6.1.5

  # Identifiers and formatting
  uuid: ^4.4.0
  intl: ^0.20.3
  collection: ^1.18.0

  # PDF export of the technical drawing
  pdf: ^3.11.1
  printing: ^5.13.1

  # File system access + OS share sheet for exports
  path_provider: ^2.1.3
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/web_3d/index.html
    - assets/web_3d/three.min.js
    - assets/web_3d/OrbitControls.js
    - assets/web_3d/opening_engine.js
