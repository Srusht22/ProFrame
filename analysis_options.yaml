# Static analysis for ProFrame.
#
# The domain layer is pure Dart and carries manufacturing geometry, so the
# analyser is configured to be strict rather than advisory: anything that would
# let an implicit `dynamic` or an unawaited future reach that code is an error,
# not a hint.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A silently dropped future in geometry or persistence loses user data.
    unawaited_futures: error
    # Dead or unreachable code usually means a case was missed.
    dead_code: error
    unnecessary_statements: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  # `sort_constructors_first` is deliberately absent. These are documented data
  # classes where the fields and their doc comments explain the type, so the
  # constructor reads better after them — and the rule fires on every enum,
  # where Dart requires the values before the constructor anyway.
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - omit_local_variable_types
    - prefer_final_locals
    - prefer_single_quotes
    - throw_in_finally
    - unawaited_futures
    - unnecessary_parenthesis
    - use_super_parameters
